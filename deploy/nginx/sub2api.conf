server {
    listen 80;
    listen [::]:80;
    server_name sub.plnt.top;

    # 限制慢速请求、超大请求头和单个来源的并发连接。
    client_header_timeout 10s;
    client_max_body_size 256m;
    large_client_header_buffers 4 16k;
    limit_conn sub2api_conn 100;

    # 对登录、注册和密码相关接口增加入口限速，应用内部仍保留第二层限流。
    location ^~ /api/v1/auth/ {
        limit_req zone=sub2api_auth burst=20 nodelay;
        include /etc/nginx/snippets/sub2api-proxy.conf;
    }

    # 其余管理页面和 API 统一转发到仅监听本机的 Sub2API 容器。
    location / {
        include /etc/nginx/snippets/sub2api-proxy.conf;
    }
}
